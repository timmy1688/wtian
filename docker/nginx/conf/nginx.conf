worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    # text/event-stream is deliberately absent: compressing SSE delays delivery
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS; resolving per request lets nginx start even when the API is down
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Hashed build assets never change; index.html must always be revalidated
    map $uri $static_cache_control {
        ~^/(js|css|img|fonts)/  "public, max-age=31536000, immutable";
        ~^/api/                 "";
        default                 "no-cache";
    }

    server {
        listen 80;
        listen [::]:80;
        server_name wtian.cloud www.wtian.cloud;

        # certbot webroot renewal (host path ~/nginx/dist/.well-known)
        location /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name wtian.cloud www.wtian.cloud;

        ssl_certificate     /etc/letsencrypt/live/wtian.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wtian.cloud/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control $static_cache_control;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            set $api_upstream http://wtian-api:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api_upstream;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Streaming interpretations can run for a few minutes; the API sends X-Accel-Buffering: no
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
